prometheus:
  port: 8080
  enable: true

nodes:
  - id: reader
    type: FolderImageNode
    folder_path: "assets/images"
    mode: "only_one"
    frame_delay: 0.0001
    outputs: [hash]


  - id: hash
    type: HashNode
    delta: 5
    hash_size: 8
    hash_type: 'dhash'
    outputs: [blur]

  - id: blur
    type: ProcessBlurInference
    model_config:
      type: BlurClassification
      path: "assets/models/trained_model-Kaggle_dataset_ts.pt"
      backend: TorchBackend
      device_id: 0
      conf: 0.6
    outputs: [embedding]

  - id: embedding
    type: ProcessEmbeddingInference
    model_config:
      type: EmbeddingFilter
      path: "assets/models/resnet18_truncated.torchscript"
      backend: TorchBackend
      device_id: 0
      eps: 0.01
      min_samples: 10
      num_extremes: 2
    batch_size: 4
    outputs: [model]

  - id: model
    type: ProcessDetBatchInference
    model_config:
      type: YOLOv8
      imgsz: 640
      path: "assets/models/yolo_emb.onnx"
      extract_embeddings: True
      backend: ONNXRuntimeBackend
      device_id: 0
    batch_size: 4
    outputs: [active_learning]

  - id: active_learning
    type: ActiveLearning
    num_to_select: 5
    conf_strategy: sum
    conf_weight: 1.0
    outputs: [create_dataset]

  - id: create_dataset
    type: CreateDataset
    save_dir: "./final_datasets"
    outputs: []

