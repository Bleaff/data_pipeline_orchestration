  - id: model
    type: ProcessDetBatchInference
    model_config:
      type: YOLOv8
      path: "/home/user/mkotovanu/neudc/assets/models/yolov8n.pt"
      extract_embeddings: True
      embed_layer_idx: -2
      backend: TorchBackend
      device_id: 0
    batch_size: 4
    outputs: [active_learning]
  
  - id: active_learning
    type: ActiveLearning
    num_to_select: 20
    conf_strategy: sum
    conf_weight: 1.0
    device_id: 0
    backend: TorchBackend
    outputs: [visualizer]


  - id: visualizer
    type: DrawNode
    outputs: [saver]

  - id: saver
    type: SaveImageNode
    save_dir: "./output_images"
    outputs: []
