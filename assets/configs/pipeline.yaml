prometheus:
  port: 8080
  enable: true

nodes:
  - id: reader
    type: FolderImageNode
    folder_path: "assets/images/"
    mode: "loop"
    frame_delay: 0.01
    outputs: [hash]

  - id: hash
    type: HashNode
    delta: 5
    hash_size: 8
    hash_type: 'dhash'
    outputs: [blur]

  - id: blur
    type: ProcessBlurInference
    model_config:
      type: BlurClassification
      path: "/home/work/Desktop/Job/neudc/assets/models/trained_model-Kaggle_dataset_ts.pt"
      backend: TorchBackend
      device_id: 0
      conf: 0.6
    folder_path: "/home/user/mkotovanu/neudc/assets/images"
    mode: "only_one"
    frame_delay: 0.0001
    outputs: [model]


  - id: model
    type: ProcessDetBatchInference
    model_config:
      type: YOLOv8
      imgsz: 640
      path: "/home/user/mkotovanu/neudc/assets/models/yolo_emb.onnx"
      extract_embeddings: True
      backend: ONNXRuntimeBackend
      device_id: 0
    batch_size: 4
    outputs: [create_dataset]

  # - id: active_learning
  #   type: ActiveLearning
  #   num_to_select: 5
  #   conf_strategy: sum
  #   conf_weight: 1.0
  #   outputs: [visualizer]

  - id: create_dataset
    type: CreateDataset
    save_dir: "./final_datasets"
    outputs: []
