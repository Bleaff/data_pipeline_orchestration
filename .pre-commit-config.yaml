repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=150"]
        # Lockfiles are large by nature and not hand-edited.
        exclude: '^assets/|frontend/package-lock\.json$'
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: name-tests-test
      - id: trailing-whitespace

  - repo: https://github.com/asottile/pyupgrade.git
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        name: Upgrade code
        args: ["--py39-plus"]

  - repo: https://github.com/psf/black.git
    rev: 25.1.0
    hooks:
      - id: black
        language: python
        args: ["--line-length=120"]

  - repo: https://github.com/PyCQA/isort.git
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--line-length=120", "--profile=black"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        # Rule selection/ignores live in pyproject.toml ([tool.ruff.lint]), not here,
        # so there is one source of truth for the config.
        args: ["--fix"]

  - repo: https://github.com/PyCQA/autoflake.git
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - "--remove-all-unused-imports"
          - "--expand-star-imports"
          - "--in-place"

  - repo: https://github.com/codespell-project/codespell.git
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - "--ignore-words-list=ACN,ALLE,COO,Synopsys,TE,Varian,Berkley,IHS"
        exclude: '.*\.toml$'

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--explicit-package-bases"]
        exclude: '^test/'
        additional_dependencies: ["types-requests"]

  # - repo: https://github.com/PyCQA/doc8
