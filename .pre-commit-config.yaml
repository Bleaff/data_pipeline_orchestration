repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v5.0.0
    hooks:
    - id: check-added-large-files
      args:
        - "--maxkb=150"
      exclude: '^assets/'
    - id: check-ast
    - id: check-case-conflict
    - id: check-json
    - id: check-merge-conflict
    - id: check-toml
    - id: check-xml
    - id: check-yaml
    - id: debug-statements
    - id: end-of-file-fixer
    - id: name-tests-test
    - id: trailing-whitespace

  - repo: https://github.com/asottile/pyupgrade.git
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        name: Upgrade code
        args:
          - "--py39-plus"

  - repo: https://github.com/psf/black.git
    rev: 25.1.0
    hooks:
      - id: black
        language: python
        args:
          - "--line-length=120"

  - repo: https://github.com/PyCQA/isort.git
    rev: 6.0.1
    hooks:
      - id: isort
        args:
          - "--line-length=120"
          - "--profile=black"

  - repo: https://github.com/PyCQA/flake8.git
    rev: 7.2.0
    hooks:
      - id: flake8
        language_version: python3
        args:
          - "--max-line-length=120"
          - "--ignore=E203,E266,E501,E722,W503,F403,F401,E704"

  - repo: https://github.com/PyCQA/autoflake.git
    rev: v2.3.1
    hooks:
    -   id: autoflake
        args:
          - "--remove-all-unused-imports"
          - "--in-place"

  - repo: https://github.com/codespell-project/codespell.git
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - "--ignore-words-list=ACN,ALLE,COO,ACN,ALLE,COO,Synopsys,TE,Varian,Berkley,IHS"
        exclude:
            (?x)^(
                .*\.toml
            )$
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ["--convention=pep257"]
  - repo: https://github.com/terrencepreilly/darglint
    rev: v1.8.1
    hooks:
      - id: darglint
        args: ["--docstring-style=pep257"]
