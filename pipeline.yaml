nodes:
  - id: reader
    type: FolderImageNode
    folder_path: "./test_images"
    mode: "loop"
    frame_delay: 0.5
    outputs: [resize]

  - id: resize
    type: ResizeProcessNode
    target_width: 320
    target_height: 240
    outputs: [saver]

  - id: saver
    type: SaveImageNode
    save_dir: "./output_images"
    outputs: []

  - id: detect
    type: DetectProcessNode
    model_path: "./model.onnx"
    threshold: 0.5
