stages:
  - lint

pre-commit:
  stage: lint
  image: python:3.11
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: pre-commit-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pre-commit
  before_script:
    - python -m pip install --upgrade pip
    - pip install pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure --color always
