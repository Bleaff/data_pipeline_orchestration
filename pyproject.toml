# Overview:
# This pyproject.toml file manages the build, packaging, and distribution of the library

# Key Sections:
# - [build-system]: Specifies the build requirements and backend (e.g., poetry, setuptools, wheel).
# - [tool.poetry]: Includes details like name, version, description, authors, dependencies and more.
# - [tool.poetry.optional-dependencies]: Provides additional, optional packages for extended features.
# - [tool.*]: Configures settings for various tools (pytest, yapf, etc.) used in the project.

# Installation:
# The neudc library can be installed using the command: 'pip install neudc'
# For development purposes, you can install the package in editable mode with: 'pip install -e .'
# This approach allows for real-time code modifications without the need for re-installation.

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Project settings -----------------------------------------------------------------------------------------------------
[tool.poetry]
name = "neudc"
version = "0.1.0"  # Update as appropriate or use dynamic versioning
description = "Premarkup framework for object detection tasks."
readme = "README.md"
authors = [
    "Ilya Basharov",
    "Marius Kotovanu",
    "Sergey Sysoev",
]
maintainers = [
    "Ilya Basharov",
    "Marius Kotovanu",
    "Sergey Sysoev",
]
license = "AGPL-3.0-or-later"
keywords = ["machine-learning", "deep-learning", "computer-vision", "cvat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
]

# Required dependencies ------------------------------------------------------------------------------------------------
[tool.poetry.dependencies]
# 3.11 is the real floor: the code uses enum.StrEnum and typing.Self.
python = ">=3.11"
pyyaml = "==6.0.2"
jaxtyping = "==0.2.36"
numba = ">=0.61.0,<0.62.0"  # 0.61 is the first line with Python 3.13 wheels (0.60 hard-refuses to install on 3.13)
numpy = ">=2.0.0,<2.3.0"  # range numba 0.61 itself declares support for
pytz = "==2024.2"
opencv-python-headless = "==4.10.0.84"
pyzmq = "==27.0.0"
tqdm = "*"
scipy = "*"
scikit-learn = "*"
imagehash = "*"
scikit-image = "*"
pydantic = "*"
prometheus-client = "*"
torchvision = "*"
torch = [
    {version = "^2.2.1", source="pypi", markers = "sys_platform == 'darwin'"},
    {version = "^2.2.1", source="torch_cuda121", markers = "sys_platform == 'linux' or sys_platform == 'win32'"},
]
ultralytics = "*"

# Optional dependencies -------------------------------------------------------------------------------------------
# `optional = true` here + the [tool.poetry.extras] table below is what actually
# makes `pip install -e ".[dev]"` etc. work; a bare [tool.poetry.optional-dependencies]
# table (the old layout here) is not a real Poetry key and is silently ignored.
pre-commit = {version = "==4.0.1", optional = true}
virtualenv = {version = "==20.28.0", optional = true}
ipdb = {version = "==0.13.13", optional = true}
ruff = {version = "*", optional = true}
mypy = {version = "*", optional = true}
cuda-python = {version = "==12.6.2.post1", optional = true}
tensorrt = {version = "==10.5.0", optional = true}
onnxruntime-gpu = {version = "*", optional = true}
sounddevice = {version = "*", optional = true}

[tool.poetry.group.test.dependencies]
pytest = "^8.0.2"
pytest-cov = "^6.0.0"

[tool.poetry.extras]
dev = ["pre-commit", "virtualenv", "ipdb", "ruff", "mypy"]
trt = ["cuda-python", "tensorrt"]
onnx = ["onnxruntime-gpu"]
audio = ["sounddevice"]

# Package sources -----------------------------------------------------------------------------------------------------
# Referenced by the `torch` dependency above for Linux/Windows CUDA wheels.
[[tool.poetry.source]]
name = "torch_cuda121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

# Project URLs --------------------------------------------------------------------------------------------------------
[tool.poetry.urls]
"Homepage" = "https://github.com/Bleaff/data_pipeline_orchestration"
"Source" = "https://github.com/Bleaff/data_pipeline_orchestration"
"Issues" = "https://github.com/Bleaff/data_pipeline_orchestration/issues"

# Tools settings -------------------------------------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 2
column_limit = 120
coalesce_brackets = true
spaces_around_power_operator = true
space_between_ending_comma_and_closing_bracket = true
split_before_closing_bracket = false
split_before_first_argument = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E203", "E266", "E501", "E722", "F403", "F401",
    "ANN101", "ANN401", "D203", "D213", "G004", "PLR0913", "S101",
    # No copyright-header convention in this repo.
    "CPY001",
    # Conflicts with black's own trailing-comma handling.
    "COM812",
    # The factory layer (NodeFactory/ModelFactory/backends) requires lazy imports by
    # design (see CLAUDE.md) so CPU-only pipelines don't pull in heavy deps at import time.
    "PLC0415",
    # `id` is the established parameter name for node identifiers across the codebase;
    # renaming every node constructor is a purely cosmetic, high-churn change.
    "A002",
]

[tool.ruff.lint.per-file-ignores]
# Tests favor readability/duck-typed fakes over the doc/annotation/design rules that
# matter for library code (see CLAUDE.md's testing guidance on lightweight mocks).
"test/**" = ["D1", "ANN", "PLR2004", "SLF001", "ARG001", "ARG002", "FBT001", "FBT002", "S105", "S106"]

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120
in-place = true
pre-summary-newline = true
close-quotes-on-newline = true

[tool.codespell]
ignore-words-list = "crate,nd,ned,strack,dota,ane,segway,fo,gool,winn,commend,bloc,nam,afterall"
skip = '*.pt,*.pth,*.torchscript,*.onnx,*.tflite,*.pb,*.bin,*.param,*.mlmodel,*.engine,*.npy,*.data*,*.csv,*pnnx*,*venv*,*translat*,__pycache__*,*.ico,*.jpg,*.png,*.mp4,*.mov,/runs,./configs,/.git,./docs/??/*.md,./docs/mkdocs_??.yml'
